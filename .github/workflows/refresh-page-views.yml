name: Refresh read-only page-view total

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-page-views.yml'

permissions:
  contents: write

concurrency:
  group: read-only-page-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the existing Hits.sh count without recording a new hit
        run: |
          python3 - <<'PY'
          import datetime
          import json
          from urllib.request import Request, urlopen

          url = "https://hits.sh/api/urns/subratamajumdar634.github.io/smajumdar"
          request = Request(url, headers={"User-Agent": "AcademicWebsite-ReadOnlyTrafficSync/1.0"})
          with urlopen(request, timeout=25) as response:
              stats = json.load(response)
          total = stats.get("total")
          if not isinstance(total, int) or total < 0:
              raise ValueError("Hits.sh returned no valid total")
          snapshot = {
              "total": total,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          }
          with open("traffic-count.json", "w", encoding="utf-8") as output:
              json.dump(snapshot, output, separators=(",", ":"), ensure_ascii=False)
              output.write("\n")
          print("Read-only view count retrieved successfully")
          PY
      - name: Publish the cached count to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic-count.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh read-only page-view snapshot"
            git push
          fi
